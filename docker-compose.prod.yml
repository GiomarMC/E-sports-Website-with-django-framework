# Production: Caddy (HTTPS + frontend) -> Django (gunicorn) -> PostgreSQL.
#   docker compose -f docker-compose.prod.yml --env-file .env up -d --build
# Configuration in .env (template: deploy/env.production.example).

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: .
    restart: unless-stopped
    env_file: ${ENV_FILE:-.env}
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      DEBUG: "False"
      NUM_PROXIES: "1"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - media:/app/media
      - private_media:/app/private_media
      - static:/app/staticfiles
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:8000/api/settings/', headers={'Host': 'localhost', 'X-Forwarded-Proto': 'https'}), timeout=5)"]
      interval: 15s
      timeout: 10s
      start_period: 40s
      retries: 5

  # Discord bot: receives the webhooks of the backend through the internal
  # network (http://bot:8080/events) and posts them. No public port.
  bot:
    build: ./bot
    restart: unless-stopped
    env_file: ${ENV_FILE:-.env}
    mem_limit: 96m

  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile.web
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
      # Without other domains the block listens on an address that never
      # matches (plain HTTP, so Caddy asks no certificate for it).
      REDIRECT_DOMAINS: ${REDIRECT_DOMAINS:-http://redirect.invalid}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - media:/srv/media:ro
      - static:/srv/static:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  postgres_data:
  media:
  private_media:
  static:
  caddy_data:
  caddy_config:
